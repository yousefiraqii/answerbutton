<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات زر الإجابة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 30px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a1a2e; border-bottom: 3px solid #4a90e2; padding-bottom: 10px; }
        label { display: block; margin-top: 18px; font-weight: 600; color: #2c3e50; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        .file-zone { border: 2px dashed #4a90e2; border-radius: 12px; padding: 30px; text-align: center; margin: 20px 0; background: #fafcff; cursor: pointer; transition: 0.3s; }
        .file-zone:hover { background: #e8f0fe; }
        .file-zone input[type="file"] { display: none; }
        button { background: #4a90e2; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        button:hover { background: #357abd; }
        .status { padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .info-box { background: #f0f4ff; padding: 15px; border-radius: 8px; margin-top: 10px; border-right: 4px solid #4a90e2; font-size: 14px; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > div { flex: 1; min-width: 200px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚙️ إعدادات زر الإجابة</h1>
    <p>هنا يمكنك إعداد مفتاح API، رفع ملف التركات (PDF)، وتخصيص طريقة الإجابة.</p>
    <div id="statusMessage" class="status"></div>

    <label>📄 رفع ملف التعليمات والتركات (PDF):</label>
    <div class="file-zone" id="dropZone">
        <p><strong>اسحب ملف PDF هنا أو اضغط للاختيار</strong></p>
        <input type="file" id="pdfFileInput" accept=".pdf">
        <p id="pdfStatus" style="font-size:13px; color:#555;"></p>
    </div>

    <label>🔑 مفتاح API (مزود متوافق مع OpenAI):</label>
    <input type="password" id="apiKey" placeholder="أدخل مفتاح API الخاص بك">

    <label>🌐 رابط المزود:</label>
    <input type="text" id="providerUrl" placeholder="مثال: https://api.openai.com/v1">

    <label>🧠 اسم النموذج:</label>
    <input type="text" id="model" placeholder="مثال: gpt-4o-mini">

    <div class="row">
        <div>
            <label>🗣️ لغة الإجابة:</label>
            <select id="language"><option value="ar">العربية</option><option value="en">English</option></select>
        </div>
        <div>
            <label>📏 طول الإجابة:</label>
            <select id="answerLength"><option value="short">قصير</option><option value="medium" selected>متوسط</option><option value="detailed">مفصل</option></select>
        </div>
    </div>

    <label>📝 تعليمات إضافية للأسلوب (اختياري):</label>
    <textarea id="instructions" placeholder="مثال: اكتب بأسلوب أكاديمي واضح، استخدم الأمثلة الواقعية..."></textarea>

    <button id="saveBtn">💾 حفظ جميع الإعدادات</button>

    <div class="info-box">
        <strong>ملاحظة:</strong> بعد حفظ الإعدادات، اذهب إلى Word، حدد سؤالاً، واضغط زر "حل السؤال" من تبويب Home.
    </div>
</div>
<script src="settings.js"></script>
</body>
</html>
